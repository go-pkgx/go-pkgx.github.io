# Ask a vulnerability database about the Go in this repository.
#
# ⛔ NOTHING HERE HAD EVER ASKED. Scanned by hand on 2026-10-18 with the
# toolchain the `go` directive then permitted — go1.27.1 — tools/versioncheck
# had 21 findings, EIGHT of them REACHABLE:
#
#   GO-2026-6617 stdlib.Write      GO-2026-6610 stdlib.AddConn
#   GO-2026-6613 stdlib.Read       GO-2026-6608 stdlib.ReadMIMEHeader
#   GO-2026-6611 stdlib.Read       GO-2026-6607 stdlib.HandshakeContext
#   GO-2026-6603 stdlib.Close      GO-2026-6605 stdlib.Do
#
# Reachable, not merely present: this tool asks the GitHub API what the latest
# release of each project is, so those are its own HTTPS paths.
#
# Raising both `go` directives to 1.27.2 took it to ZERO — not one notice,
# zero. It needed no dependency bump.
#
# ⛔ IT SCANS tools/versioncheck, NOT THE ROOT. The root module is the SITE's:
# it pins the landingkit Hugo module and contains no Go packages at all, so
# `govulncheck ./...` there writes a report with no SBOM in it. vulngate
# refuses that report rather than reading it as a clean bill —
#
#   ::error::govulncheck exited without reporting that it loaded the packages
#   (no SBOM in its output): the scan did not run, which is not the same as
#   finding nothing
#
# — which is how the right directory was found rather than assumed.
name: govulncheck

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, because the answer changes when a database entry is published,
    # not when this repository changes. 06:41, just after versioncheck's cron.
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    name: govulncheck, judged by vulngate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Pinned, not `stable`. An unpinned toolchain changes the compiler
          # under the repository with no commit to point at.
          go-version: '1.27.3'
      # ⛔ NO `set -o pipefail` and no bare exit status: govulncheck exits
      # non-zero over findings it has decided are NOT called, and zero over
      # some it has, which is the whole reason vulngate exists. The emptiness
      # check is the other half — a scan that wrote nothing must not read as
      # nothing found. Scanner @latest, judge pinned: the scanner should know
      # about an advisory published this morning, the verdict should not
      # change under the repository without a commit.
      - name: govulncheck, judged by vulngate
        working-directory: tools/versioncheck
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.23.0
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > "$RUNNER_TEMP/vuln.json" || true
          test -s "$RUNNER_TEMP/vuln.json" || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" "$RUNNER_TEMP/vuln.json"
