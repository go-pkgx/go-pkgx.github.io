# Ask a vulnerability database about the Go in this repository.
#
# ⛔ NOTHING HERE HAD EVER ASKED. Scanned by hand on 2026-10-18 with the
# toolchain the `go` directive then permitted — go1.27.1 — tools/versioncheck
# had 21 findings, EIGHT of them REACHABLE:
#
#   GO-2026-6617 stdlib.Write      GO-2026-6610 stdlib.AddConn
#   GO-2026-6613 stdlib.Read       GO-2026-6608 stdlib.ReadMIMEHeader
#   GO-2026-6611 stdlib.Read       GO-2026-6607 stdlib.HandshakeContext
#   GO-2026-6603 stdlib.Close      GO-2026-6605 stdlib.Do
#
# Reachable, not merely present: this tool asks the GitHub API what the latest
# release of each project is, so those are its own HTTPS paths.
#
# Raising both `go` directives to 1.27.2 took it to ZERO — not one notice,
# zero. It needed no dependency bump.
#
# ⛔ IT SCANNED tools/versioncheck, NOT THE ROOT. The root module is the SITE's:
# it pins the landingkit Hugo module and contains no Go packages at all, so
# `govulncheck ./...` there writes a report with no SBOM in it. vulngate
# refuses that report rather than reading it as a clean bill —
#
#   ::error::govulncheck exited without reporting that it loaded the packages
#   (no SBOM in its output): the scan did not run, which is not the same as
#   finding nothing
#
# — which is how the right directory was found rather than assumed.
#
# ⛔ AND THEN THE REPOSITORY GREW AROUND THAT ONE DIRECTORY. By 2026-10-31 there
# were FOUR modules: the root, tools/versioncheck, tools/wasmstage (the
# playground's staging tool: an OCI client, x/crypto, two decompressors) and
# tools/playground (the WASI confrontation). Two of them had never been asked
# about anything, and tools/wasmstage is both the one with a real dependency
# surface and the one whose output is deployed. Found by running
# go-fleettools/fleettools' `vulnscan` over the organisation, which reported
# this repository UNREAD rather than clean — a refusal to answer outranking an
# answer, which is the only reason it surfaced at all.
#
# The reasoning above was right and it named ONE directory. So the directory is
# no longer named: `tools/vulnmods` DISCOVERS every go.mod and scans each, and a
# fifth tool is covered with no edit here. It skips a module whose
# `go list ./...` matches no packages — measured, not inferred from vulngate's
# refusal, because a module that has STOPPED BUILDING produces that same
# refusal — and it fails if NO module was actually scanned, because "everything
# was skipped" and "nothing was found" must not look alike.
name: govulncheck

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, because the answer changes when a database entry is published,
    # not when this repository changes. 06:41, just after versioncheck's cron.
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    name: govulncheck, judged by vulngate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Pinned, not `stable`. An unpinned toolchain changes the compiler
          # under the repository with no commit to point at.
          go-version: '1.27.3'
      # ⛔ NO `set -o pipefail` and no bare exit status: govulncheck exits
      # non-zero over findings it has decided are NOT called, and zero over
      # some it has, which is the whole reason vulngate exists. The emptiness
      # check is the other half — a scan that wrote nothing must not read as
      # nothing found. Scanner @latest, judge pinned: the scanner should know
      # about an advisory published this morning, the verdict should not
      # change under the repository without a commit.
      - name: every module, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.23.0
          BIN="$(go env GOPATH)/bin"
          cd tools/vulnmods
          go run . -root ../.. -govulncheck "$BIN/govulncheck" -vulngate "$BIN/vulngate"

      # The scanner itself is tested, because its DISCOVERY is the thing that
      # replaced a hand-named directory. A discovery that quietly returned one
      # module would pass every assertion above and be the original defect
      # again, so one of its tests asserts against this repository's real tree.
      - name: the scanner's own tests
        working-directory: tools/vulnmods
        run: |
          set -eu
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet ./...
          go test ./...
