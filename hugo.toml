[[params.repos]]
  name = "pkgx"
  pkg = "github.com/go-pkgx/pkgx"
  url = "https://github.com/go-pkgx/pkgx"
  status = "ready"
  blurb = "The **runtime**, and the **catalogue** that says what exists. Run any package on the fly — `pkgx node@22 --version` — or bring several into an environment — `pkgx +git +gnu.org/bash -- ./build.sh`. It materialises each package's full dependency closure on demand and execs through the pkgx glibc loader, so it works on a literally-empty **`FROM scratch`** image.<br><br>The same repository ships **`pkgs`**, which answers what is available without running anything. `pkgs ls <node>` lists what is under a node — a namespace lists what it contains, a package what it needs — and `--tree` descends; `--dependents` walks the other way, which is what you ask before CHANGING something. `pkgs why <a> <b>` gives the shortest path by which one needs the other, as `nix why-depends` answers it: an explanation, not every route. `pkgs search rg` finds `crates.io/ripgrep` by the COMMAND it provides, which no guess at the project name reaches. `pkgs browse` walks the tree full-screen — arrows to descend, `/` to search, space to pin — and prints what you pinned, so `pkgx +$(pkgs browse)` composes.<br><br>**`pkgs catalog update` is the only command that asks the registry what exists.** `ls`, `search` and `<TAB>` then read that file, so completion is instant and works with no network at all — **6.2 ms median, measured with the registry blackholed**. `--platform linux/x86-64` fetches another platform's catalogue from a mac without disturbing the host's, and `catalog reindex` rebuilds the index a shipped image already carries, offline. `pkgs store` says what the bottle store holds and what a lock keeps alive, the way `guix gc --list-live` does — and, like it, **removes nothing**.<br><br>**`pkge`** — a shell function, `pkgx env`, because a child cannot change its parent's environment — is the HPC face: environments declared in HCL2, Lmod modulefile generation, and an importer that CONVERTS a Lua or TCL modulefile rather than interpreting it, refusing any statement it would have to guess at. On a heterogeneous cluster `PKGX_DIR=/shared/pkgx/{platform}` gives each architecture its own tree in one NFS export, since a prefix carries no platform and `lib/libssl.so.3` is the same file name on x86-64 and aarch64. Two `CGO_ENABLED=0` binaries, `pkgx` and `pkgs`."

[[params.repos]]
  name = "pkgm"
  pkg = "github.com/go-pkgx/pkgm"
  url = "https://github.com/go-pkgx/pkgm"
  status = "ready"
  blurb = "The **installer**. Resolves a package's runtime closure from the pkgx pantry, downloads the bottles, and installs them — mirroring the reference pkgm CLI (`install`/`uninstall`/`shim`/`list`/`outdated`/`update`/`pin`) as a **drop-in replacement**, plus a `run` that completes the closure from ELF `DT_NEEDED` and runs it on **`FROM scratch`**."

[[params.repos]]
  name = "bottle"
  pkg = "github.com/go-pkgx/bottle"
  url = "https://github.com/go-pkgx/bottle"
  status = "ready"
  blurb = "The **shared backend** both tools import — one source of truth for the pkgx bottle protocol: resolution, download, **soname-exact `FROM scratch` closure completion**, and loader-aware exec. `net/http` with an embedded CA bundle replaces curl+openssl; `compress/gzip` + a pure-Go xz decoder replace info-zip+xz."

[[params.repos]]
  name = "mirror"
  pkg = "github.com/go-pkgx/mirror"
  url = "https://github.com/go-pkgx/mirror"
  status = "ready"
  blurb = "**Sync a local mirror** of pkgx bottles from the official dist into the same servable tree layout — per os/arch, incremental, with `--closure` to pull a package's full runtime closure (plus the implicit `FROM scratch` system libs). Serve it statically and point pkgm/pkgx at it with `PKGX_DIST=<mirror-url>`."

[[params.repos]]
  name = "bk"
  pkg = "github.com/go-pkgx/bk"
  url = "https://github.com/go-pkgx/bk"
  status = "ready"
  blurb = "**The build tool**, a from-scratch `CGO_ENABLED=0` reimplementation of pkgx's brewkit — which was Deno/TypeScript with Ruby and `patchelf` helpers. It reads a pantry `package.yml`, builds in a pkgx environment, relocates the install tree and packages a bottle. The reference tool is *native*: everything pivots on the host being the thing it builds for. Here **Target is not Host by design**, so the target platform is a first-class value and a **Windows PE bottle built on a Linux or macOS host** is a supported path rather than a retrofit, and so is a pure-Go **`wasip1/wasm` module** (target triple `wasm32-wasip1`, no POSIX relocation) — and so is C: `bk` adds the `llvm.org` bottle plus a wasi-libc sysroot and compiler-rt builtins built from source, and imposes `clang --target=wasm32-wasip1 --sysroot=… -resource-dir=…` through `$BK_CC`, never a prebuilt wasi-sdk."

[[params.repos]]
  name = "packages"
  pkg = "github.com/go-pkgx/packages"
  url = "https://github.com/go-pkgx/packages"
  status = "ready"
  blurb = "**The factory.** It runs `bk` over the pkgx pantry and publishes to `ghcr.io/go-pkgx/packages`, each package an OCI artifact carrying a CycloneDX SBOM and an in-toto SLSA provenance statement as OCI referrers. Measured from the published `registry.json` on **2026-10-31**: **1 585 projects, 42 756 bottles** across linux/aarch64 (15 136), linux/x86-64 (13 255), darwin/x86-64 (7 113), darwin/aarch64 (6 649), windows/x86-64 (554) and linux/s390x (49). It is a moving target, so re-measure rather than trust this line — the platform list especially, which should be **derived from the file** and not read from here: that index holds **six** platforms while the registry publishes **seven**, because it carries no `wasip1/wasm` rows at all ([packages#392](https://github.com/go-pkgx/packages/issues/392)). `pkgs catalog platforms` asks the registry and is the authority. A **`wasip1/wasm`** platform, measured against the registry on 2026-10-31: **34 projects**, each asked for with the platform-checked resolver rather than read from a tag listing. `wasip1.yml` publishes **30 pure-Go tools** — `yq`, `gojq`, `jsonnet`, `shfmt`, `gofumpt`, `actionlint`, `revive`, `gosec`, `crane`, `mockgen`, `age` and more — and `wasip1-c.yml` **4 C and C++ tools** built inside the sovereign rootfs with our own source-built toolchain (llvm.org, wasi-libc, compiler-rt, libc++): `zlib`, `sqlite3`, `lua` (whose errors are longjmp, run through WebAssembly exception handling) and the C++ `simdjson`, on linux/x86-64 and linux/aarch64 hosts. **Every module is RUN under wasmtime before it is published**, which is why the list is what it is: a program that reads files or stdin and writes stdout ports almost for free, while one that draws on a terminal does not — the rejections and their causes are in the docs. The OCI platform is `os=wasip1, architecture=wasm`, and you can run them in the browser on the [playground](/playground/)."

[[params.repos]]
  name = "pantry-overlay"
  pkg = "github.com/go-pkgx/pantry-overlay"
  url = "https://github.com/go-pkgx/pantry-overlay"
  status = "ready"
  blurb = "**The corrections**, consumed through `PKGX_PANTRY_OVERLAY`: each recipe here overrides the matching upstream one and everything else falls back. It exists because an upstream recipe can be unsatisfiable against the current registry — curl, wget and git pin `openssl.org: ^1.1` while openssl is 3.x and 4.x — so without the overlay `pkgm install` cannot resolve the closure the published bottles were actually built against."

[[params.repos]]
  name = "registry-viewer"
  pkg = "github.com/go-pkgx/registry-viewer"
  url = "https://github.com/go-pkgx/registry-viewer"
  status = "ready"
  blurb = "**The tree you are already using.** A `CGO_ENABLED=0` WASM browser app that renders the registry as a filterable `TreeTable`, drawn to a `<canvas>` with go-widgets/toolkit and go-widgets/painter. It powers <https://go-pkgx.github.io/packages/>, reading the `registry.json` the factory emits."

[[params.repos]]
  name = "docs"
  pkg = "github.com/go-pkgx/pkgx"
  url = "https://go-pkgx.github.io/docs/"
  status = "ready"
  blurb = "Documentation (MkDocs Material): usage, the **full-pantry FROM-scratch conformance sweep** (1818 projects), and the maintained `soname → project` fix list. A pantry-wide audit on **2026-09-26** found **1818 of 1896** projects published a linux bottle (the pantry held 1899 on 2026-10-04), and after the soname-exact fix **73 of 81** previously-failing projects run on scratch."
