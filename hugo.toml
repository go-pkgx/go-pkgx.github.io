baseURL = "https://go-pkgx.github.io/"
title = "go-pkgx"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The brand colours the shared stylesheet reads. They are NOT a choice made
# here: static/img/logo.svg carries the gradient #F59E0B → #B45309, and these
# follow it. go-authn and go-fileshare are cyan for the same reason — their own
# logos are — which is why the stylesheet takes them as parameters instead of
# hard-coding one family's colour into a file three orgs share.
#
# The mapping mirrors theirs exactly: the logo's DARKER stop is the light-mode
# accent (it has to carry text on white), the BRIGHTER stop is the dark-mode
# one, and `deep` is a further step down for the gradient's far end.
[params.brand]
  base   = "#B45309"   # logo's darker stop — light-mode accent and gradient start
  deep   = "#78350F"   # a step darker again — gradient end
  bright = "#F59E0B"   # logo's brighter stop — dark-mode accent
  shadow = "rgba(180,83,9,.7)"   # = base, for the primary button's drop shadow
  # Chip tints: `base`/`bright` mixed into white at the same 12% and 30% the
  # cyan family uses, so the two read as the same design in different hues.
  chipBg         = "#fef3e2"
  chipBorder     = "#fce2b6"
  chipFg         = "#78350F"
  chipBgDark     = "rgba(245,158,11,.14)"
  chipBorderDark = "rgba(245,158,11,.32)"
  chipFgDark     = "#fcd34d"

[[params.repos]]
  name = "pkgx"
  pkg = "github.com/go-pkgx/pkgx"
  url = "https://github.com/go-pkgx/pkgx"
  status = "ready"
  blurb = "The **runtime**. Run any package on the fly — `pkgx node@22 --version` — or bring several into an environment — `pkgx +git +gnu.org/bash -- ./build.sh`. It materialises each package's full dependency closure on demand and execs through the pkgx glibc loader, so it works on a literally-empty **`FROM scratch`** image. A single `CGO_ENABLED=0` binary."

[[params.repos]]
  name = "pkgm"
  pkg = "github.com/go-pkgx/pkgm"
  url = "https://github.com/go-pkgx/pkgm"
  status = "ready"
  blurb = "The **installer**. Resolves a package's runtime closure from the pkgx pantry, downloads the bottles, and installs them — mirroring the reference pkgm CLI (`install`/`uninstall`/`shim`/`list`/`outdated`/`update`/`pin`) as a **drop-in replacement**, plus a `run` that completes the closure from ELF `DT_NEEDED` and runs it on **`FROM scratch`**."

[[params.repos]]
  name = "bottle"
  pkg = "github.com/go-pkgx/bottle"
  url = "https://github.com/go-pkgx/bottle"
  status = "ready"
  blurb = "The **shared backend** both tools import — one source of truth for the pkgx bottle protocol: resolution, download, **soname-exact `FROM scratch` closure completion**, and loader-aware exec. `net/http` with an embedded CA bundle replaces curl+openssl; `compress/gzip` + a pure-Go xz decoder replace info-zip+xz."

[[params.repos]]
  name = "mirror"
  pkg = "github.com/go-pkgx/mirror"
  url = "https://github.com/go-pkgx/mirror"
  status = "ready"
  blurb = "**Sync a local mirror** of pkgx bottles from the official dist into the same servable tree layout — per os/arch, incremental, with `--closure` to pull a package's full runtime closure (plus the implicit `FROM scratch` system libs). Serve it statically and point pkgm/pkgx at it with `PKGX_DIST=<mirror-url>`."

[[params.repos]]
  name = "docs"
  pkg = "github.com/go-pkgx/pkgx"
  url = "https://go-pkgx.github.io/docs/"
  status = "ready"
  blurb = "Documentation (MkDocs Material): usage, the **full-pantry FROM-scratch conformance sweep** (1818 projects), and the maintained `soname → project` fix list. A pantry-wide audit found **1818 of 1896** projects publish a linux bottle, and after the soname-exact fix **73 of 81** previously-failing projects run on scratch."
